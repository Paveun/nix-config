name: CI Checks
on:
  pull_request: # Runs whenever a PR is created or updated

jobs:
  verify-hosts:
    strategy:
      fail-fast: false # If aion fails, don't cancel razer; let both finish
      max-parallel: 1
      matrix:
        host: [aion, razer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: paveun
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          # pushFilter: "(-source$|nixpkgs\\.tar\\.gz$)"

      - name: Verify ${{ matrix.host }}
        # The matrix dynamically swaps in 'aion' and 'razer'
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --max-jobs 1
