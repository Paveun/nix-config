name: Update Flake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Update flake.lock and Create PR
        id: update
        uses: DeterminateSystems/update-flake-lock@v24
        with:
          # Using your PAT allows the PR to trigger the 'check.yml' workflow
          token: ${{ secrets.PAT_TOKEN }}
          pr-title: "chore: flake update"

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: paveun # REPLACE with your actual cache name
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Verify aion
        run: nix build .#nixosConfigurations.aion.config.system.build.toplevel --max-jobs 1

      - name: Verify razer
        run: nix build .#nixosConfigurations.razer.config.system.build.toplevel --max-jobs 1
