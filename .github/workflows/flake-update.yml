name: Update Flake and Verify Linux
permissions:
  contents: write
  pull-requests: write
on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight
  workflow_dispatch: # Allows manual triggering

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Update flake.lock
        id: update
        uses: DeterminateSystems/update-flake-lock@v24
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-title: "chore: daily flake update"

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: paveun # REPLACE with your actual cache name
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Verify aion
        run: nix build .#nixosConfigurations.aion.config.system.build.toplevel --max-jobs 1

      - name: Verify razer
        run: nix build .#nixosConfigurations.razer.config.system.build.toplevel --max-jobs 1
